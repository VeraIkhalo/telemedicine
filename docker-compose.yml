services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amrutam
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  migrate:
    build: .
    command: ["node", "scripts/migrate.js"]
    environment: &appenv
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/amrutam
      JWT_SECRET: local-demo-secret-change-in-prod
      ENCRYPTION_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    environment:
      <<: *appenv
      OTEL_SERVICE_NAME: amrutam-api
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: .
    command: ["node", "-r", "./src/observability/tracing.js", "src/jobs/worker.js"]
    environment:
      <<: *appenv
      OTEL_SERVICE_NAME: amrutam-worker
    depends_on:
      migrate: { condition: service_completed_successfully }

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

volumes:
  pgdata:
