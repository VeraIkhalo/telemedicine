<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amrutam Console</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="leaf">❦</span> Amrutam <small>Telemedicine test console</small></div>
    <div class="who">
      <span id="who"></span>
      <button id="toggle-log" class="ghost small" title="Show the raw API calls this page makes">Show API log</button>
    </div>
  </header>

  <div class="layout">
    <main id="main"></main>

    <aside class="log" id="log-panel" hidden>
      <div class="log-head">
        <h3>API request log</h3>
        <button id="clear-log" class="ghost small">Clear</button>
      </div>
      <p class="hint">Every call this page makes to the backend, newest first. Click one to see the response.</p>
      <ol id="log"></ol>
    </aside>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
